name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify default branch and package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo "Run this workflow from master to publish package.json version $VERSION" >&2
            exit 1
          fi
          echo "Publishing translatronx $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run --coverage
        env:
          CI: true

      - name: Publish package with npm trusted publishing
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DIST_TAG="latest"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
          esac
          if npm view "translatronx@${VERSION}" version >/dev/null 2>&1; then
            echo "translatronx ${VERSION} is already published; skipping publish"
          else
            npm publish --access public --tag "$DIST_TAG"
          fi

      - name: Create GitHub release
        uses: actions/github-script@v9
        with:
          script: |
            const version = require('./package.json').version;
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`GitHub release ${tag} already exists; skipping`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `translatronx v${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: version.includes('-'),
              });
            }
