name: Translatron

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate catalogs and provenance
        env:
          STRICT_TRANSLATIONS: ${{ github.head_ref == 'translatron/generated' }}
        shell: bash
        run: |
          # Source PRs can have pending translations; the generated PR must be complete.
          status=0
          npx translatronx check --json > check.json || status=$?
          cat check.json
          if [ "$STRICT_TRANSLATIONS" = "true" ]; then
            exit "$status"
          fi
          # Keep structural errors as a gate for source PRs. Missing/stale/orphan
          # work is handled by the serialized translation PR after merge.
          jq -e '[.issues[] | select(.kind == "empty" or .kind == "placeholder" or .kind == "icu" or .kind == "markup")] | length == 0' check.json

  translate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: translatron-generated-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate translations
        id: sync
        continue-on-error: true
        run: npx translatronx sync --json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Check generated translations
        id: check
        continue-on-error: true
        run: npx translatronx check --json
      - name: Open or update the generated translation PR
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: translatron/generated
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No translation changes."
            exit 0
          fi
          git add -A
          git commit -m "chore(i18n): update generated translations"
          git push --force origin "HEAD:refs/heads/$BOT_BRANCH"
          if gh pr view "$BOT_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BOT_BRANCH" --title "chore(i18n): update generated translations" --body "Generated by Translatron after merge."
          else
            gh pr create --head "$BOT_BRANCH" --title "chore(i18n): update generated translations" --body "Generated by Translatron after merge."
          fi
      - name: Report incomplete translation run
        if: steps.sync.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 3
