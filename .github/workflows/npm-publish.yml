name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Bump a published version, or retry the current unpublished version
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - retry-current

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm token secret
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::GitHub Actions secret NPM_TOKEN is missing or empty'
            exit 1
          fi

      - name: Verify current master
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo 'Run this workflow from master' >&2
            exit 1
          fi
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'Master changed after this workflow was queued; start a new release run' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Select release version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          case "$VERSION_BUMP" in
            patch|minor|major|retry-current) ;;
            *) echo "Unsupported version bump: $VERSION_BUMP" >&2; exit 1 ;;
          esac
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if npm view "translatronx@${CURRENT_VERSION}" version >/dev/null 2>&1; then
            if [ "$VERSION_BUMP" = 'retry-current' ]; then
              echo "translatronx ${CURRENT_VERSION} is already published" >&2
              exit 1
            fi
            npm --no-git-tag-version version "$VERSION_BUMP"
            VERSION="$(node -p "require('./package.json').version")"
            TAG_REF="$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
            if [ -n "$TAG_REF" ]; then
              echo "Release tag v${VERSION} already exists" >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json
            git commit -m "chore(release): v${VERSION}"
          elif [ "$VERSION_BUMP" != 'retry-current' ]; then
            echo "translatronx ${CURRENT_VERSION} is not published; choose retry-current to finish this release" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run --coverage
        env:
          CI: true

      - name: Verify master before publishing
        run: |
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo 'Master changed during validation; start a new release run' >&2
            exit 1
          fi

      - name: Publish package with npm token
        id: npm_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DIST_TAG="latest"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
          esac
          npm publish --access public --tag "$DIST_TAG"

      - name: Explain npm publishing access
        if: failure() && steps.npm_publish.outcome == 'failure'
        run: |
          echo '::error::If npm returned 404, verify NPM_TOKEN can publish translatronx and the package allows token publishing.'

      - name: Push release version
        if: inputs.version_bump != 'retry-current'
        run: git push origin HEAD:master

      - name: Create GitHub release
        uses: actions/github-script@v9
        with:
          script: |
            const version = require('./package.json').version;
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`GitHub release ${tag} already exists; skipping`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: '${{ steps.version.outputs.sha }}',
                name: `translatronx v${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: version.includes('-'),
              });
            }
