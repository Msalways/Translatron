name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify current master
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo 'Run this workflow from master' >&2
            exit 1
          fi
          git fetch origin master
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo 'Master changed after this workflow was queued; start a new release run' >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Bump package version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          case "$VERSION_BUMP" in
            patch|minor|major) ;;
            *) echo "Unsupported version bump: $VERSION_BUMP" >&2; exit 1 ;;
          esac
          npm --no-git-tag-version version "$VERSION_BUMP"
          VERSION="$(node -p "require('./package.json').version")"
          TAG_REF="$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          if [ -n "$TAG_REF" ]; then
            echo "Release tag v${VERSION} already exists" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run --coverage
        env:
          CI: true

      - name: Push release version
        run: git push origin HEAD:master

      - name: Publish package with npm trusted publishing
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          DIST_TAG="latest"
          case "$VERSION" in
            *-*) DIST_TAG="next" ;;
          esac
          npm publish --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        uses: actions/github-script@v9
        with:
          script: |
            const version = require('./package.json').version;
            const tag = `v${version}`;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`GitHub release ${tag} already exists; skipping`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: '${{ steps.version.outputs.sha }}',
                name: `translatronx v${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: version.includes('-'),
              });
            }
